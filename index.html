<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>Max Morhardt – Software Engineer</title>
    <meta
      name="description"
      content="Max Morhardt is a software engineer at Fidelity Investments building full-stack systems end-to-end — Java, Go, TypeScript, React, Vue 3, Kubernetes, and AWS."
    />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maxstash.io/" />
    <meta property="og:site_name" content="Max Morhardt" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Max Morhardt – Software Engineer" />
    <meta
      property="og:description"
      content="Max Morhardt is a software engineer at Fidelity Investments building full-stack systems end-to-end — Java, Go, TypeScript, React, Vue 3, Kubernetes, and AWS."
    />
    <meta property="og:image" content="https://maxstash.io/favicon/android-chrome-512x512.png" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Max Morhardt – Software Engineer" />
    <meta
      name="twitter:description"
      content="Max Morhardt is a software engineer at Fidelity Investments building full-stack systems end-to-end — Java, Go, TypeScript, React, Vue 3, Kubernetes, and AWS."
    />
    <meta name="twitter:image" content="https://maxstash.io/favicon/android-chrome-512x512.png" />
    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Max Morhardt",
        "url": "https://maxstash.io/",
        "jobTitle": "Software Engineer",
        "worksFor": {
          "@type": "Organization",
          "name": "Fidelity Investments"
        },
        "sameAs": [
          "https://github.com/maxmorhardt",
          "https://www.linkedin.com/in/max-morhardt-60b9121b8/"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('maxstash:theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
